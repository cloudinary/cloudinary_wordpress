name: CI

on:
  push:
    branches: [ develop, master ]
  workflow_call:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '7.4', '8.5' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run build
        run: npm run build

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-phpstan-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-phpstan-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: .phpstan-cache
          key: ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock', 'phpstan.neon.dist') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock', 'phpstan.neon.dist') }}-
            ${{ runner.os }}-phpstan-

      - name: Run PHPStan
        run: composer phpstan

  unit:
    name: Unit (PHPUnit)
    runs-on: ubuntu-latest
    env:
      # Shell-expanded by wp-env; matches the "Cache wp-env sources" path.
      WP_ENV_HOME: /home/runner/.wp-env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-unit-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-unit-

      # wp-env downloads WordPress and the core PHPUnit suite into this
      # directory, which is roughly a gigabyte of git clones. Caching it keeps
      # `env:start` from re-cloning them on every run. The key covers the
      # wp-env config and version, because a change to either means different
      # sources have to be downloaded.
      #
      # WP_ENV_HOME is pinned at the job level because wp-env's default differs
      # per platform (`~/.wp-env`, or `~/wp-env` on Linux runners that ship
      # snap), and the unpinned path produced a cache that was never saved.
      - name: Cache wp-env sources
        uses: actions/cache@v4
        with:
          path: ${{ env.WP_ENV_HOME }}
          key: ${{ runner.os }}-wp-env-${{ hashFiles('.wp-env.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wp-env-

      # Also installs the Composer dependencies through the postinstall script.
      - name: Install dependencies
        run: npm ci

      - name: Start wp-env
        run: npm run env:start

      - name: Run unit tests
        run: npm run test:unit

      - name: Stop wp-env
        if: always()
        run: npm run env:stop

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts skips the postinstall hook: `composer install` only
      # pulls dev tooling (phpcs, phpstan, phpunit) the plugin does not load
      # at runtime, and `patch-package` only patches wp-hookdoc for the docs
      # build. Neither is needed to run the e2e suite.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # wp-env spends most of its time pulling Docker images and installing
      # WordPress, none of which depends on the Node-side steps. Run it in the
      # background while the browser install and asset build proceed, then
      # wait for it. All of this has to live in one step because `wait` only
      # sees children of the same shell. wp-env output goes to a file and is
      # printed afterwards so the interleaved log stays readable.
      - name: Start wp-env, install browsers, build assets
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm run env:start > wp-env-start.log 2>&1 &
          wp_env_pid=$!

          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
            # Browser binaries came from cache; only the apt packages they
            # need are missing on a fresh runner.
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

          npm run build

          echo "::group::wp-env start"
          if wait "$wp_env_pid"; then
            cat wp-env-start.log
            echo "::endgroup::"
          else
            cat wp-env-start.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Run E2E tests
        env:
          CLOUDINARY_E2E_URL: ${{ secrets.CLOUDINARY_E2E_URL }}
        run: npm run test:e2e

      - name: Stop wp-env
        if: always()
        run: npm run env:stop

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          retention-days: 7
